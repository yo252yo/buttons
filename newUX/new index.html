<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>◈ BUTTONS</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --grey: #c8c4bf;
      --green: #00FF40;
      --blue: #00BFFF;
      --purple: #DF73FF;
      --orange: #FF9966;
      --white: #ffffff;
      --bg: #0d0f12;
      --grid: rgba(255, 255, 255, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--grey);
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }

    /* HUD */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 10px 20px;
      background: linear-gradient(180deg, rgba(13, 15, 18, 0.98) 0%, rgba(13, 15, 18, 0.7) 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    #hud-title {
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.15em;
    }

    #hud-node {
      color: var(--white);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #hud-depth {
      color: var(--orange);
    }

    #hud-keys {
      color: rgba(200, 196, 191, 0.4);
      font-size: 10px;
    }

    #hud-overview {
      color: var(--green);
      font-size: 12px;
      letter-spacing: 0.2em;
      display: none;
    }

    #hud-overview.active {
      display: block;
    }

    /* VIEWPORT */
    #viewport {
      position: fixed;
      top: 40px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      cursor: default;
    }

    /* DOT GRID BACKGROUND */
    #viewport::before {
      content: '';
      position: absolute;
      inset: -200px;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* WORLD */
    #world {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* SVG EDGES LAYER */
    #edges-svg {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      overflow: visible;
    }

    /* NODE BASE */
    .node {
      position: absolute;
      border-radius: 8px;
      padding: 10px 14px;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      background: rgba(13, 15, 18, 0.85);
      backdrop-filter: blur(2px);
      transition: opacity 0.3s ease, transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
      min-width: 60px;
    }

    .node .node-emoji {
      font-size: 16px;
      line-height: 1;
      margin-bottom: 4px;
      display: block;
    }

    .node .node-title {
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--white);
    }

    .node .node-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 6px 0;
      display: none;
    }

    .node .node-complement {
      font-size: 11px;
      font-weight: 400;
      line-height: 1.5;
      color: rgba(200, 196, 191, 0.8);
      display: none;
      white-space: pre-wrap;
    }

    /* NODE STATES */
    .node.state-current {
      border-color: rgba(255, 255, 255, 0.4) !important;
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.12), 0 0 6px rgba(255, 255, 255, 0.06);
      z-index: 10;
      transform: scale(1.02);
    }

    .node.state-current .node-divider,
    .node.state-current .node-complement {
      display: block;
    }

    .node.state-current .node-title {
      font-size: 13px;
    }

    .node.state-visited {
      opacity: 0.65;
      z-index: 5;
    }

    .node.state-visited .node-divider,
    .node.state-visited .node-complement {
      display: block;
    }

    .node.state-child {
      transform: scale(0.78);
      transform-origin: center center;
      opacity: 0.45;
      z-index: 3;
    }

    .node.state-child .node-title {
      font-size: 10px;
      font-weight: 600;
    }

    .node.state-child-selected {
      transform: scale(0.88);
      transform-origin: center center;
      opacity: 0.85;
      z-index: 4;
      box-shadow: 0 0 16px var(--node-color, rgba(0, 191, 255, 0.3));
      border-color: var(--node-color, rgba(0, 191, 255, 0.6)) !important;
    }

    .node.state-child-selected .node-title {
      font-size: 11px;
    }

    .node.state-hidden {
      display: none !important;
    }

    /* GROUP NODES */
    .node-group {
      position: absolute;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: transparent;
      pointer-events: none;
      z-index: 0;
    }

    .node-group .group-label {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 10px;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.35;
    }

    /* SELECTION ARROW */
    .sel-arrow {
      position: absolute;
      pointer-events: none;
      z-index: 20;
      transition: all 0.3s ease;
    }

    /* OVERVIEW MODE */
    body.overview-mode .node.state-current,
    body.overview-mode .node.state-visited,
    body.overview-mode .node.state-child,
    body.overview-mode .node.state-child-selected {
      transform: scale(1) !important;
    }

    body.overview-mode .node .node-complement {
      display: none !important;
    }

    body.overview-mode .node .node-divider {
      display: none !important;
    }

    body.overview-mode .node .node-title {
      font-size: 9px !important;
    }

    body.overview-mode .node .node-emoji {
      font-size: 12px !important;
    }

    /* STAGGER REVEAL ANIMATION */
    @keyframes nodeReveal {
      0% {
        opacity: 0;
        transform: scale(0.5) translateY(10px);
      }

      60% {
        transform: scale(1.1) translateY(-2px);
      }

      100% {
        opacity: 1;
        transform: scale(0.78) translateY(0);
      }
    }

    .node.revealing {
      animation: nodeReveal 0.5s ease forwards;
    }

    .node.state-child.revealing {
      animation: nodeReveal 0.5s ease forwards;
    }

    /* ARRIVAL ANIMATION */
    @keyframes nodePop {
      0% {
        transform: scale(0.7);
        opacity: 0.5;
      }

      60% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1.02);
        opacity: 1;
      }
    }

    .node.popping {
      animation: nodePop 0.4s ease forwards !important;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      gap: 16px;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 0.15em;
      color: var(--blue);
      font-size: 13px;
      transition: opacity 0.5s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-dot {
      display: inline-block;
      animation: blink 1s infinite;
    }

    .loading-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 0.2;
      }

      50% {
        opacity: 1;
      }
    }

    /* Edge path styles applied via JS */
  </style>
</head>

<body>

  <div id="loading">
    <div>◈ BUTTONS</div>
    <div>INITIALIZING<span class="loading-dot">.</span><span class="loading-dot">.</span><span
        class="loading-dot">.</span></div>
  </div>

  <div id="hud">
    <span id="hud-title">◈ BUTTONS</span>
    <span id="hud-node">—</span>
    <span id="hud-depth">DEPTH: 0</span>
    <span id="hud-overview">[ OVERVIEW ]</span>
    <span id="hud-keys">W=BACK · S/↵=GO · A/D=SELECT · TAB=OVERVIEW</span>
  </div>

  <div id="viewport">
    <div id="world">
      <svg id="edges-svg" width="0" height="0"></svg>
    </div>
  </div>

  <script>
    // ============================================================
    // CANVAS DATA (embedded)
    // ============================================================
    const CANVAS_DATA = { "nodes": [{ "id": "4fb0a5e6022e5f3b", "type": "group", "x": 5400, "y": 2280, "width": 1070, "height": 3080, "color": "2", "label": "The boy who owned all the drawings" }, { "id": "fd4fcaef8f4b1b8d", "type": "group", "x": 4320, "y": 1120, "width": 710, "height": 4220, "color": "6", "label": "the human who mined content" }, { "id": "6fa511ae137a65cc", "type": "text", "text": "He lived in a world where Everything was Property.\n---\n\"These Drawings are Mine!\" the boy cried, and most of them agreed.", "styleAttributes": {}, "x": 5510, "y": 2520, "width": 420, "height": 160 }, { "id": "d04384f7886c1105", "type": "text", "text": "He took the first Drawing and cut a small part, showing just a few colored shapes.\n---\n\"These Shapes are Mine!\" the boy cried, and most of them agreed.", "styleAttributes": {}, "x": 5520, "y": 2820, "width": 400, "height": 200 }, { "id": "114ed8174d319419", "type": "text", "text": "He cut his Drawing even more, so that it was just a colorful square.\n---\n\"This Color is Mine!\" the boy cried, and most of them agreed.", "styleAttributes": {}, "x": 5980, "y": 2940, "width": 440, "height": 160 }, { "id": "bcd71d2261c0e655", "type": "text", "text": "The eyes sent a signal to the brain. It remained as a memory long after the light went out.\n---\n\"These Neurons are Mine!\" the boy cried, and most of them agreed.", "styleAttributes": {}, "x": 6000, "y": 3260, "width": 440, "height": 180 }, { "id": "2eea4012c9d8f789", "type": "text", "text": "He drew over it more and more, erased here, added traits there, so that the Drawing became identical to a famous Drawing.\n---\n\"This Drawing is Mine!\" the boy cried, and most of them agreed.", "styleAttributes": {}, "x": 5920, "y": 4080, "width": 460, "height": 160 }, { "id": "f95bb921c5da8a86", "type": "text", "text": "He drew over some more and it became another. Some more still and yet another.\n---\n\"All the Drawings are Mine!\" the boy cried, and most of them agreed.", "styleAttributes": {}, "x": 5920, "y": 4360, "width": 460, "height": 180 }, { "id": "133ec80224b63d45", "type": "text", "text": "On the other side of the world, a girl made a drawing of herself near a house.\nShe didn't know about the boy who owned all the Drawings.\nShe didn't know anything, she was too young to even speak.\nBut her drawing happened to be exactly identical to the last Drawing.\n---\n\"This drawing is Mine!\" the boy cried, and most of them agreed.", "styleAttributes": {}, "x": 5830, "y": 4800, "width": 620, "height": 220 }, { "id": "a081086cf09996a1", "type": "text", "text": "🏁 For her shameless theft, the girl was thrown into a jail, surrounded by Mines in the sand.\nThe boy continued to own all the Drawings.\nWhen people wanted new Drawings, they came to see him, and he would sell them one.\nBut he would always say as he gave them away:\n---\n\"This Drawing is Mine!\" and most of them agreed.", "styleAttributes": {}, "x": 5830, "y": 5060, "width": 620, "height": 240 }, { "id": "dfa55b934cd4da3b", "type": "text", "text": "⭐ The boy who owned all the drawings", "x": 5480, "y": 2300, "width": 480, "height": 60, "color": "2" }, { "id": "8507a4f396bf7b89", "type": "text", "text": "There once was a boy, no older than a child, who made five Drawings of himself near a Mine.", "styleAttributes": {}, "x": 5510, "y": 2400, "width": 420, "height": 80 }, { "id": "52d8d865227f9937", "type": "text", "text": "He showed the second Drawing to people. The light reflected the Drawing on their eyes.\n---\n\"These Eyes are Mine!\" the boy cried, and most of them agreed.", "styleAttributes": {}, "x": 5480, "y": 3200, "width": 420, "height": 160 }, { "id": "496d96affe49eb03", "type": "text", "text": "He scanned the third Drawing into a computer. It made a PNG, a binary number on a silicon chip.\n---\n\"This Number is Mine!\" the boy cried, and most of them agreed.", "styleAttributes": {}, "x": 5490, "y": 3600, "width": 380, "height": 180 }, { "id": "f5033b54f858e81a", "type": "text", "text": "He took the fourth Drawing and changed the color.\n---\n\"This Drawing is Mine!\" the boy cried, and most of them agreed.", "styleAttributes": {}, "x": 5420, "y": 4000, "width": 340, "height": 120 }, { "id": "2d4cd6e7a3d82540", "type": "text", "text": "As for the last Drawing...", "styleAttributes": {}, "x": 6020, "y": 4660, "width": 240, "height": 60 }, { "id": "9ef6935c6cd0fd18", "type": "text", "text": "He saved his PNG to JPG. He even saved to TXT! He made new formats and new programs so that his Drawing corresponded to many numbers and many many texts.\n---\n\"These Numbers are Mine!\" the boy cried, and most of them agreed.", "styleAttributes": {}, "x": 5990, "y": 3680, "width": 460, "height": 160 }, { "id": "24792acc47f5cd88", "type": "text", "text": "And every now and then, the Human found really meaningful, life-changing Content!\n---\nIt would be Purple, or even Orange!", "styleAttributes": {}, "x": 4420, "y": 1665, "width": 520, "height": 175, "color": "6" }, { "id": "6c8b770c79956309", "type": "text", "text": "Might there be other colors of Content, deeper down the Mine? \n---\nPerhaps even some color nobody had ever seen? ", "styleAttributes": {}, "x": 4440, "y": 1920, "width": 480, "height": 140 }, { "id": "9d3abbbc0493c4df", "type": "text", "text": "Sometimes it was Blue!\n---\nRarer Content even!", "styleAttributes": {}, "x": 4500, "y": 1500, "width": 360, "height": 100, "color": "5" }, { "id": "1bcf6b5761cf7a7d", "type": "text", "text": "Every day, every night, the Human mined and mined.", "styleAttributes": {}, "x": 4550, "y": 2098, "width": 260, "height": 55, "color": "4" }, { "id": "c34dac9fc595b778", "type": "text", "text": "⭐ The story of a human who mined\n---\nThis is the story of a human.\nA human who mined content in the content mines.\nA human like any other.\nA human like all the others.", "x": 4440, "y": 1141, "width": 483, "height": 139, "color": "6" }, { "id": "4ab8595855066bc0", "type": "text", "text": "Eager to get a promised treasure, the Person dug and dug some more.", "styleAttributes": {}, "x": 4460, "y": 2990, "width": 420, "height": 90, "color": "4" }, { "id": "e6942076715d8e49", "type": "text", "text": "The Human was puzzled by this weird tale.\n---\nIt was very different from most of the Content the Human had seen.\nWhat color was it, even?\nWhat did it mean?\nThe Human would have to think about it some more.", "styleAttributes": {}, "x": 4450, "y": 3860, "width": 560, "height": 200, "color": "4" }, { "id": "70bdecd74b82cfb8", "type": "text", "text": "The Human looked around, and pondered for a while. \n---\nDeep, deep, down the Content Mines were billions of little pebbles, each a slightly different color.", "styleAttributes": {}, "x": 4500, "y": 4120, "width": 460, "height": 170, "color": "4" }, { "id": "a5eae91e243e2f4a", "type": "text", "text": " Most of them too small to ever matter. Most of them weird and worthless.\n ---\n Could one be a color nobody saw before?", "styleAttributes": {}, "x": 4500, "y": 4340, "width": 460, "height": 180, "color": "4" }, { "id": "b83cfcdfe65ce99d", "type": "text", "text": "But the Human had been promised.\n---\nDeep, deep down there was were true treasures lie.", "styleAttributes": {}, "x": 4500, "y": 4580, "width": 460, "height": 120, "color": "4" }, { "id": "a465e6ba9613dee3", "type": "text", "text": "The Human did not hear the tale.\n---\nThe Human kept digging. Dug further, deeper than anyone before.", "styleAttributes": {}, "x": 4340, "y": 2820, "width": 660, "height": 120, "color": "4" }, { "id": "0173ceade77cf7e8", "type": "text", "text": "So the Human kept digging.\n---\nDug further, deeper than anyone before.", "styleAttributes": {}, "x": 4500, "y": 4760, "width": 460, "height": 120, "color": "4" }, { "id": "e8a1ac3d0e386526", "type": "text", "text": "And every now and then, the Human would stop and look at a pebble.\n---\nA pebble that the light of day would probably never reach.", "styleAttributes": {}, "x": 4475, "y": 4940, "width": 510, "height": 140, "color": "4" }, { "id": "4788b2826d843f4a", "type": "text", "text": "🏁 And for a brief moment, the Human would behold.\n---\nAnd the pebble would shine, illuminated by their torch.", "styleAttributes": {}, "x": 4543, "y": 5160, "width": 375, "height": 160, "color": "2" }, { "id": "08db8ce2820805f8", "type": "text", "text": "One day, the Human found a weird tale, deep at the bottom of the Content Mine.\n---\nIt was a tale written by a Human and it was called \"The boy who owned all the drawings\".", "styleAttributes": {}, "x": 4470, "y": 2230, "width": 420, "height": 200, "color": "4" }, { "id": "c7d18375f103b273", "type": "text", "text": "Do you want to hear it?", "styleAttributes": {}, "x": 4550, "y": 2490, "width": 260, "height": 60, "color": "5" }, { "id": "0702430de465e684", "type": "text", "text": "And that it why the story of a human who mined does not have an end.", "styleAttributes": {}, "x": 4500, "y": 3240, "width": 340, "height": 80, "color": "4" }, { "id": "872d20b7f9ca523a", "type": "text", "text": "Surrounded by pebbles, deeper, always deeper, the Person dug some more.", "styleAttributes": {}, "x": 4500, "y": 3120, "width": 340, "height": 80, "color": "4" }, { "id": "a0a53c60800647b7", "type": "text", "text": "🕋 Peter Molyneux and his team kept working on \"Curiosity: What's Inside the Cube?\" while the game was being played.\n---\nDuring April 2013, they introduced a mechanic were players could pay to strengthen the cube and handicap other people.\nIt appears that they wanted to boost competition.", "styleAttributes": {}, "x": 3200, "y": 5600, "width": 640, "height": 220, "color": "5" }, { "id": "81260c7f4251ee66", "type": "text", "text": "They adapted the size and density of the cube in real time.\n---\nWith their players, it could have taken years for the cube to reach its end.\nIt might never reach a clear end.\nThat could not be allowed.", "styleAttributes": {}, "x": 3200, "y": 5870, "width": 640, "height": 190, "color": "5" }, { "id": "fd9c954e9436b581", "type": "text", "text": "By the end, the cube had been sneakily shrunk to a third of its size.\n---\nTo suit their timing goals and marketing purposes, the cube ended up containing only 25 of the 69 promised pushes.", "styleAttributes": {}, "x": 3200, "y": 6095, "width": 640, "height": 165, "color": "5" }, { "id": "1e2de0148b8d1e51", "type": "text", "text": "🏁 End of Minecraft DLC", "styleAttributes": {}, "x": 3390, "y": 6460, "width": 260, "height": 60, "color": "5" }, { "id": "cde9c8848a3554ac", "type": "text", "text": "The objective had always been a moving target,\n---\ngiving the victory an aftertaste of shallowness and arbitrariness.", "styleAttributes": {}, "x": 3200, "y": 6297, "width": 640, "height": 120, "color": "5" }, { "id": "0a8efd74b6f5b920", "type": "text", "text": "Since this game was released, many more billions of buttons have been pushed, down in the Content Mines.", "styleAttributes": {}, "x": 3413, "y": 65, "width": 405, "height": 100, "color": "5" }, { "id": "764bb5f0a810e10c", "type": "text", "text": "Pushes from CREATORs,\n---\nworking hard on their crafts.", "styleAttributes": {}, "x": 3413, "y": 200, "width": 405, "height": 100, "color": "5" }, { "id": "19eaea0fa7a1ab36", "type": "text", "text": "Pushes from their SUPPORTERs,\n---\nwith each platform taking a cut.", "styleAttributes": {}, "x": 3413, "y": 320, "width": 405, "height": 140, "color": "5" }, { "id": "b08a1f29e00493d1", "type": "text", "text": "Pushes from CONSUMERs,\n---\nwatching among the ads.", "styleAttributes": {}, "x": 3413, "y": 480, "width": 405, "height": 120, "color": "5" }, { "id": "046574ad25d5a11c", "type": "text", "text": " A beautiful rendition of the prisoner dilemma at scale...", "styleAttributes": {}, "x": 3863, "y": 80, "width": 370, "height": 120, "color": "6" }, { "id": "57824f04d6dd06bf", "type": "text", "text": "In 2026, he released in early access a project touted as his last.\n---\nHe says it takes place in the same universe as Fable, his magnum opus.\nBut this cannot be explicit because Microsoft now owns the world he created.", "styleAttributes": {}, "x": 4188, "y": -500, "width": 545, "height": 220, "color": "4" }, { "id": "0849b51c435a3ee8", "type": "text", "text": "\"Curiosity: What's Inside the Cube?\" will forever remain as a weird experiment at the border between capitalism and poetry.", "styleAttributes": {}, "x": 3413, "y": -140, "width": 405, "height": 100, "color": "5" }, { "id": "4e960cd2c6fb35a4", "type": "text", "text": "Can I see what's inside?\n---\nUnlikely. Access is tightly controlled.\nThe Bani Shaiba clan has had a monopoly over the keys for centuries.\nOnly religious leaders and state guests have been allowed in.", "styleAttributes": {}, "x": 4403, "y": -1500, "width": 400, "height": 200 }, { "id": "a99a77a3915ab03d", "type": "text", "text": "🚰 \nhttps://www.bismillahtours.com/blog/inside-the-kaaba.html", "styleAttributes": {}, "x": 4843, "y": -1460, "width": 260, "height": 180 }, { "id": "101641e29cc5bec8", "type": "text", "text": "And, of course, the cleaners and maintenance crew.", "styleAttributes": {}, "x": 4473, "y": -1260, "width": 260, "height": 60 }, { "id": "a47cd0e0b01921f1", "type": "text", "text": "Why did you chose this emoji?\n---\nThe only other cube I found was 🧊.\nBut mostly I thought the Kaaba offered interesting food for thoughts along the themes of this work.\nAlthough obviously its situation is very different and should be explored at a later time.", "styleAttributes": {}, "x": 4103, "y": -1590, "width": 260, "height": 360 }, { "id": "a696b2f33ffb5fa9", "type": "text", "text": "Fun fact: This is the part of the game that was written first.\n---\nIt was renamed into \"Minecraft DLC\" because of the theme of the mine. \nIt was then buried deep, deep into the game so that it would only be found by the most dedicated miners.", "styleAttributes": {}, "x": 4403, "y": -2400, "width": 520, "height": 200, "color": "6" }, { "id": "d295529a22167065", "type": "text", "text": "What's this emoji 🕋 ?\n---\nThis is the emoji for the Kaaba, a stone cube of 12 meters located at the centre of the Al-Masjid al-Haram Mosque in Mecca.\nIt is a holy site, a millennia old prayer house where the religion started.", "styleAttributes": {}, "x": 4063, "y": -2120, "width": 460, "height": 200 }, { "id": "0770a001c43be657", "type": "text", "text": "🚧 I'm sorry, the Hajj and the Kaaba are in another DLC.", "styleAttributes": {}, "x": 4033, "y": -1800, "width": 260, "height": 115, "color": "3" }, { "id": "129d31dc3cca6ada", "type": "text", "text": "What's Inside the Cube?\n---\nNot much, it's a humble prayer space and it is not for me to divulge its content, though it is not hard to find.", "styleAttributes": {}, "x": 4403, "y": -1760, "width": 420, "height": 160 }, { "id": "start", "type": "text", "text": "⭐ Minecraft DLC\n---\nAn interactive visual novel hommage to Curiosity: What's Inside the Cube? and The Cyberiad.", "x": 3443, "y": -2640, "width": 560, "height": 140, "color": "5" }, { "id": "58bf14261ac7f236", "type": "text", "text": "🕋 This is the story of a cube.", "styleAttributes": {}, "x": 3593, "y": -2380, "width": 260, "height": 80, "color": "5" }, { "id": "b86293aa042f7749", "type": "text", "text": "🕰️ On November 6th, 2012, Apple released accidentally \"Curiosity: What's Inside the Cube?\".\n---\nIt was an experimental game from Peter Molyneux intended to release at 12:22 on November 7th.", "styleAttributes": {}, "x": 3343, "y": -2090, "width": 545, "height": 200, "color": "5" }, { "id": "9ff173246e3b02f9", "type": "text", "text": "The game was simple\n---\nA cube with a mystery inside.\n\nIt would open after 69 billion pushes.\n\nOnly the last pusher would see and get the content of the cube.", "styleAttributes": {}, "x": 3343, "y": -1820, "width": 545, "height": 200, "color": "5" }, { "id": "3b297dce9e992fb9", "type": "text", "text": "🕰️ On May 26th, 2013, after almost 7 months of collaborative pushing, the cube met its end.\n---\nPeter Molyneux announced the prize to everyone.\n\nThe winner was to be a god in their next game, Godus.", "styleAttributes": {}, "x": 3343, "y": -1560, "width": 545, "height": 220, "color": "5" }, { "id": "b061fe86ca8c2608", "type": "text", "text": "Sometimes the Content was slightly Green.\n---\nThat meant it was slightly rare.", "styleAttributes": {}, "x": 4510, "y": 1320, "width": 340, "height": 130, "color": "4" }, { "id": "23d8c3b1aa81d7f5", "type": "text", "text": "Peter Molyneux moved on to other projects.", "styleAttributes": {}, "x": 3343, "y": -700, "width": 545, "height": 60, "color": "5" }, { "id": "20b86345bd1b601f", "type": "text", "text": "Godus never left early access.\n---\nBryan received neither the economical ownership nor the metaphorical one he was promised over its world.", "styleAttributes": {}, "x": 3343, "y": -900, "width": 545, "height": 140, "color": "5" }, { "id": "2fa224c7f8834b6b", "type": "text", "text": "👥 The person who did the last push was named Bryan.\n---\nHe was promised the title of \"God of God\" in Godus, and a 1% share of its revenue.", "styleAttributes": {}, "x": 3343, "y": -1280, "width": 545, "height": 190, "color": "5" }, { "id": "ae018b78ab6162a0", "type": "text", "text": "In a 2013 Wired magazine, Molyneux indicated that the monetization options offered in the game to increase pushing rate generated...\n---\n\"a few tens of thousands pounds\".", "styleAttributes": {}, "x": 2600, "y": -920, "width": 560, "height": 180, "color": "6" }, { "id": "4d329ddc8a1939fd", "type": "text", "text": "By the way...\n---\nIt's well known in the psychology of game design that in monetization schemes most of the revenue comes from very few humans.", "styleAttributes": {}, "x": 2600, "y": -480, "width": 560, "height": 200 }, { "id": "d98eaff359804382", "type": "text", "text": "That's microgaming whales...\n---\nThat's billionaire oligarchs...", "styleAttributes": {}, "x": 2880, "y": -180, "width": 380, "height": 123 }, { "id": "c2531a2aa36892f9", "type": "text", "text": "The Pareto principle\n---\n80% of the riches belong to 20% of the humans.\n99% to the 1%.\nSurely you've noticed.\n\nhttps://en.wikipedia.org/wiki/Pareto_principle\n\n", "styleAttributes": {}, "x": 2340, "y": -180, "width": 400, "height": 245 }, { "id": "c92c8b8a15c855e7", "type": "text", "text": "It is an interesting sum...\n---\nSmall enough to barely register for his company.\n\nBig enough to really impact an individual life.\n", "styleAttributes": {}, "x": 2600, "y": -700, "width": 560, "height": 160 }, { "id": "070c8ea486789c74", "type": "text", "text": "That's every social phenomena.\n---\nThey all follow what's called a \"scale-free\" structure.\n\nhttps://en.wikipedia.org/wiki/Scale-free_network", "styleAttributes": {}, "x": 2880, "y": -20, "width": 380, "height": 240 }, { "id": "3272c410cae7c252", "type": "text", "text": "A crisp allegory of the chase for object petit a...\n---\nA lacanian theory best explained by philosopher Slavoj Zizek.", "styleAttributes": {}, "x": 4273, "y": 80, "width": 580, "height": 120, "color": "2" }, { "id": "b89d239316fbf1b3", "type": "text", "text": " By the way, Lacan was notoriously right wing.\n ---\n His theory never really touches on notions such as competition, or any systemic phenomenon for that matter.", "styleAttributes": {}, "x": 4733, "y": 300, "width": 360, "height": 240 }, { "id": "d7d73d1c95dd8d0d", "type": "text", "text": "🚧 Do I really need to say it? Of course object petit a is in another DLC.", "styleAttributes": {}, "x": 4361, "y": 320, "width": 260, "height": 115, "color": "3" }, { "id": "a18efb3ee045ad29", "type": "text", "text": "👥 Peter Molyneux", "styleAttributes": {}, "x": 2880, "y": -1780, "width": 260, "height": 60 }, { "id": "2a5eb9396cb7be60", "type": "text", "text": "Pushes from EVERYONE!\n---\nWho can EXIST without Content?", "styleAttributes": {}, "x": 3413, "y": 620, "width": 405, "height": 120, "color": "5" }, { "id": "3e208fbd7524f4f3", "type": "text", "text": "So much so that pushing buttons became the story of every human...", "styleAttributes": {}, "x": 3413, "y": 760, "width": 405, "height": 100, "color": "5" }, { "id": "86439a1783954d86", "type": "text", "text": "Like how you find the Fibonacci sequence everywhere in nature...\n---\nOr exponential functions...", "styleAttributes": {}, "x": 2880, "y": 280, "width": 380, "height": 180 }, { "id": "76ba34d532c6a1c6", "type": "text", "text": "He named the game \"Albion\".\n---\nHe claimed that a historical term cannot be copyrighted.", "styleAttributes": {}, "x": 4241, "y": -200, "width": 440, "height": 140, "color": "4" }, { "id": "554eb90205906a89", "type": "text", "text": "It was supposed to be a clicker.\n---\nYou'd click on the Content Mine to find Content. \nOnce you've clicked enough, you'd unlock a new page, which would bring you deeper in the mine.\nThe book keeps you company while you Mine, the Mine gives you reward while you dig deeper.\nWin/win.\nAnd of course, a pleasant progression and big climax at the end!", "styleAttributes": {}, "x": 4603, "y": -2080, "width": 620, "height": 260 }, { "id": "1679748107ce2768", "type": "text", "text": "Maybe I'll still do that someday.\n---\nFor now, you have the MINER PATH.", "styleAttributes": {}, "x": 4843, "y": -1745, "width": 380, "height": 120 }], "edges": [{ "id": "d3035a1d524280ff", "styleAttributes": {}, "toFloating": false, "fromNode": "c34dac9fc595b778", "fromSide": "bottom", "toNode": "b061fe86ca8c2608", "toSide": "top", "color": "4" }, { "id": "e719463e43e1d443", "styleAttributes": {}, "toFloating": false, "fromFloating": false, "fromNode": "b061fe86ca8c2608", "fromSide": "bottom", "toNode": "9d3abbbc0493c4df", "toSide": "top", "color": "4" }, { "id": "ccb6c28428454f1a", "styleAttributes": {}, "toFloating": false, "fromFloating": false, "fromNode": "9d3abbbc0493c4df", "fromSide": "bottom", "toNode": "24792acc47f5cd88", "toSide": "top", "color": "4" }, { "id": "a430fea95ff9bc22", "styleAttributes": {}, "toFloating": false, "fromFloating": false, "fromNode": "24792acc47f5cd88", "fromSide": "bottom", "toNode": "6c8b770c79956309", "toSide": "top", "color": "4" }, { "id": "327f5a3f2f16abc8", "styleAttributes": {}, "toFloating": false, "fromFloating": false, "fromNode": "6c8b770c79956309", "fromSide": "bottom", "toNode": "1bcf6b5761cf7a7d", "toSide": "top", "color": "4" }, { "id": "ab644d42f1d2c382", "styleAttributes": {}, "toFloating": false, "fromFloating": false, "fromNode": "1bcf6b5761cf7a7d", "fromSide": "bottom", "toNode": "08db8ce2820805f8", "toSide": "top", "color": "4" }, { "id": "de0a3cd5c5cae312", "styleAttributes": {}, "toFloating": false, "fromFloating": false, "fromNode": "08db8ce2820805f8", "fromSide": "bottom", "toNode": "c7d18375f103b273", "toSide": "top", "color": "4" }, { "id": "f0b8390065229f6c", "styleAttributes": {}, "toFloating": false, "fromFloating": false, "fromNode": "dfa55b934cd4da3b", "fromSide": "bottom", "toNode": "8507a4f396bf7b89", "toSide": "top", "color": "4" }, { "id": "44757d934ef83b0c", "styleAttributes": {}, "toFloating": false, "fromFloating": false, "fromNode": "c7d18375f103b273", "fromSide": "bottom", "toNode": "dfa55b934cd4da3b", "toSide": "top", "color": "4" }, { "id": "9704cfe4ddff1e8c", "styleAttributes": {}, "toFloating": false, "fromFloating": false, "fromNode": "8507a4f396bf7b89", "fromSide": "bottom", "toNode": "6fa511ae137a65cc", "toSide": "top", "color": "4" }, { "id": "8ddeed0b15077497", "styleAttributes": {}, "toFloating": false, "fromFloating": false, "fromNode": "c7d18375f103b273", "fromSide": "bottom", "toNode": "a465e6ba9613dee3", "toSide": "top", "color": "4" }, { "id": "9bc2f286bdcfeaa1", "styleAttributes": {}, "toFloating": false, "fromFloating": false, "fromNode": "6fa511ae137a65cc", "fromSide": "bottom", "toNode": "d04384f7886c1105", "toSide": "top", "color": "4" }, { "id": "ad954279d778fd5b", "styleAttributes": {}, "toFloating": false, "fromFloating": false, "fromNode": "a465e6ba96 , "color": "5" }, { "id": "d1c50b2da4e6aa5a", "styleAttributes": {}, "toFloating": false, "fromFloating": false, "fromNode": "19eaea0fa7a1ab36", "fromSide": "bottom", "toNode": "b08a1f29e00493d1", "toSide": "top", "color": "5" }, { "id": "250455d6788d1702", "styleAttributes": {}, "toFloating": false, "fromNode": "b08a1f29e00493d1", "fromSide": "bottom", "toNode": "2a5eb9396cb7be60", "toSide": "top", "color": "5" }, { "id": "3ca7018e3d21e419", "styleAttributes": {}, "toFloating": false, "fromNode": "2a5eb9396cb7be60", "fromSide": "bottom", "toNode": "3e208fbd7524f4f3", "toSide": "top", "color": "5" }, { "id": "fea945a893da1829", "styleAttributes": {}, "toFloating": false, "fromFloating": false, "fromNode": "3e208fbd7524f4f3", "fromSide": "bottom", "toNode": "c34dac9fc595b778", "toSide": "top", "color": "5" }, { "id": "3c3632fd5c69fd3f", "styleAttributes": {}, "toFloating": false, "fromNode": "2fa224c7f8834b6b", "fromSide": "bottom", "toNode": "ae018b78ab6162a0", "toSide": "top" }, { "id": "376071c243688040", "styleAttributes": {}, "toFloating": false, "fromNode": "ae018b78ab6162a0", "fromSide": "bottom", "toNode": "c92c8b8a15c855e7", "toSide": "top" }, { "id": "d0cd8589ebbf2715", "styleAttributes": {}, "toFloating": false, "fromNode": "c92c8b8a15c855e7", "fromSide": "bottom", "toNode": "4d329ddc8a1939fd", "toSide": "top" }, { "id": "64de4ae68e6dc11d", "styleAttributes": {}, "toFloating": false, "fromNode": "4d329ddc8a1939fd", "fromSide": "bottom", "toNode": "d98eaff359804382", "toSide": "top" }, { "id": "9af631b209125e47", "styleAttributes": {}, "toFloating": false, "fromNode": "4d329ddc8a1939fd", "fromSide": "bottom", "toNode": "c2531a2aa36892f9", "toSide": "top" }, { "id": "7e3c35606c2bf7ff", "styleAttributes": {}, "toFloating": false, "fromNode": "d98eaff359804382", "fromSide": "bottom", "toNode": "070c8ea486789c74", "toSide": "top" }, { "id": "b71357e304953f0d", "styleAttributes": {}, "toFloating": false, "fromNode": "start", "fromSide": "bottom", "toNode": "a696b2f33ffb5fa9", "toSide": "top" }, { "id": "3a7fe21b9f507ef2", "styleAttributes": {}, "toFloating": false, "fromNode": "b86293aa042f7749", "fromSide": "bottom", "toNode": "a18efb3ee045ad29", "toSide": "top" }, { "id": "ac33428f3ac8e96b", "styleAttributes": {}, "toFloating": false, "fromNode": "070c8ea486789c74", "fromSide": "bottom", "toNode": "86439a1783954d86", "toSide": "top" }] };

    // ============================================================
    // COLOR MAPPING
    // ============================================================
    const COLOR_MAP = {
      '0': '#c8c4bf', '1': '#ffffff', '2': '#FF9966',
      '3': '#ffffff', '4': '#00FF40', '5': '#00BFFF',
      '6': '#DF73FF', undefined: '#c8c4bf', null: '#c8c4bf'
    };
    function getColor(colorKey) { return COLOR_MAP[colorKey] || COLOR_MAP[undefined]; }

    // ============================================================
    // CAPITALIZE SUBSTRINGS
    // ============================================================
    const CAPITALS = ['HUMAN', 'BUTTON', 'STORY', 'CREATOR', 'CONSUMER', 'SUPPORTER', 'EVERYONE', 'EXIST', 'MINER PATH'];
    function capitalize_substrings(text) {
      let result = text;
      for (const word of CAPITALS) {
        const regex = new RegExp(word, 'gi');
        result = result.replace(regex, word);
      }
      return result;
    }

    // ============================================================
    // EXTRACT EMOJI
    // ============================================================
    function extractEmoji(text) {
      try {
        const segmenter = new Intl.Segmenter([], { granularity: 'grapheme' });
        const segs = [...segmenter.segment(text)];
        if (segs.length && /\p{Emoji}/u.test(segs[0].segment)) {
          return { emoji: segs[0].segment, rest: text.slice(segs[0].segment.length).trimStart() };
        }
      } catch (e) { }
      return { emoji: null, rest: text };
    }

    // ============================================================
    // PARSE CANVAS
    // ============================================================
    const nodeMap = {};
    const nodes = [];
    const groups = [];
    const edgesRaw = CANVAS_DATA.edges;

    for (const n of CANVAS_DATA.nodes) {
      if (n.type === 'group') {
        groups.push(n);
      } else if (n.type === 'text') {
        const node = {
          id: n.id,
          raw: n,
          x: n.x, y: n.y,
          width: n.width || 300, height: n.height || 120,
          color: n.color || null,
          cssColor: getColor(n.color),
          children: [],
          parents: [],
          visited: false,
          el: null,
        };
        // Parse text: split on \n---\n
        const parts = n.text.split(/\n---\n/);
        const titleRaw = parts[0].trim();
        const complement = parts.slice(1).join('\n---\n').trim();
        const { emoji, rest } = extractEmoji(titleRaw);
        node.emoji = emoji;
        node.title = capitalize_substrings(rest || titleRaw);
        node.complement = capitalize_substrings(complement);
        nodes.push(node);
        nodeMap[n.id] = node;
      }
    }

    // Build adjacency
    for (const edge of edgesRaw) {
      const from = nodeMap[edge.fromNode];
      const to = nodeMap[edge.toNode];
      if (from && to) {
        if (!from.children.includes(to.id)) from.children.push(to.id);
        if (!to.parents.includes(from.id)) to.parents.push(from.id);
      }
    }

    // Sort children by x
    for (const node of nodes) {
      node.children.sort((a, b) => {
        const na = nodeMap[a], nb = nodeMap[b];
        return (na ? na.x : 0) - (nb ? nb.x : 0);
      });
    }

    // ============================================================
    // STATE
    // ============================================================
    let currentId = 'start';
    let history = ['start'];
    let selectedChildIdx = 0;
    let overviewMode = false;

    // Visited set
    const visited = new Set(['start']);

    // Camera state
    let camX = 0, camY = 0, camScale = 1;

    // ============================================================
    // DOM SETUP
    // ============================================================
    const world = document.getElementById('world');
    const edgesSvg = document.getElementById('edges-svg');

    // Create group overlays
    for (const g of groups) {
      const el = document.createElement('div');
      el.className = 'node-group';
      el.style.left = g.x + 'px';
      el.style.top = g.y + 'px';
      el.style.width = g.width + 'px';
      el.style.height = g.height + 'px';
      el.style.borderColor = getColor(g.color) + '20';
      if (g.label) {
        const lbl = document.createElement('div');
        lbl.className = 'group-label';
        lbl.style.color = getColor(g.color);
        lbl.textContent = g.label.toUpperCase();
        el.appendChild(lbl);
      }
      world.appendChild(el);
    }

    // Create node elements
    for (const node of nodes) {
      const el = document.createElement('div');
      el.className = 'node state-hidden';
      el.id = 'node-' + node.id;
      el.style.left = node.x + 'px';
      el.style.top = node.y + 'px';
      el.style.width = node.width + 'px';
      el.style.minHeight = node.height + 'px';
      el.style.borderColor = node.cssColor + '30';
      el.style.setProperty('--node-color', node.cssColor);

      if (node.emoji) {
        const emojiEl = document.createElement('span');
        emojiEl.className = 'node-emoji';
        emojiEl.textContent = node.emoji;
        el.appendChild(emojiEl);
      }

      const titleEl = document.createElement('div');
      titleEl.className = 'node-title';
      titleEl.style.color = node.cssColor;
      titleEl.textContent = node.title;
      el.appendChild(titleEl);

      if (node.complement) {
        const div = document.createElement('div');
        div.className = 'node-divider';
        el.appendChild(div);
        const compEl = document.createElement('div');
        compEl.className = 'node-complement';
        // Convert URLs to clickable
        const safeComp = node.complement.replace(/(https?:\/\/[^\s\n]+)/g, '<a href="$1" target="_blank" style="color:inherit;opacity:0.7;word-break:break-all;">$1</a>');
        compEl.innerHTML = safeComp;
        el.appendChild(compEl);
      }

      world.appendChild(el);
      node.el = el;
    }

    // ============================================================
    // EDGE DRAWING
    // ============================================================
    function getNodeCenter(node) {
      return { x: node.x + node.width / 2, y: node.y + node.height / 2 };
    }

    function drawEdges() {
      // Clear SVG
      while (edgesSvg.firstChild) edgesSvg.removeChild(edgesSvg.firstChild);

      const cur = nodeMap[currentId];
      if (!cur) return;

      for (const edge of edgesRaw) {
        const from = nodeMap[edge.fromNode];
        const to = nodeMap[edge.toNode];
        if (!from || !to) continue;

        // Determine visibility
        const fromVisited = visited.has(from.id);
        const toVisited = visited.has(to.id);
        const fromIsCurrent = from.id === currentId;
        const toIsChild = cur.children.includes(to.id);

        let style = null;
        let edgeColor = '#c8c4bf';

        if (fromVisited && toVisited) {
          // Fully visible visited edge
          edgeColor = edge.color ? getColor(edge.color) : from.cssColor;
          style = 'visited';
        } else if (fromIsCurrent && toIsChild && !toVisited) {
          // Frontier edge
          edgeColor = edge.color ? getColor(edge.color) : to.cssColor;
          style = 'frontier';
          const selIdx = cur.children.indexOf(to.id);
          if (selIdx === selectedChildIdx) style = 'frontier-selected';
        } else if (fromVisited && toIsChild && !toVisited) {
          edgeColor = edge.color ? getColor(edge.color) : to.cssColor;
          style = 'frontier';
        } else {
          continue; // hidden
        }

        const fc = getNodeCenter(from);
        const tc = getNodeCenter(to);

        // Bezier control points
        const dx = tc.x - fc.x;
        const dy = tc.y - fc.y;
        const cp1x = fc.x + dx * 0.1;
        const cp1y = fc.y + Math.sign(dy) * Math.abs(dy) * 0.5;
        const cp2x = tc.x - dx * 0.1;
        const cp2y = tc.y - Math.sign(dy) * Math.abs(dy) * 0.5;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const d = `M ${fc.x} ${fc.y} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${tc.x} ${tc.y}`;
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');

        if (style === 'visited') {
          path.setAttribute('stroke', edgeColor);
          path.setAttribute('stroke-width', '1.5');
          path.setAttribute('stroke-opacity', '0.5');
        } else if (style === 'frontier-selected') {
          path.setAttribute('stroke', edgeColor);
          path.setAttribute('stroke-width', '2');
          path.setAttribute('stroke-opacity', '0.8');
          path.setAttribute('stroke-dasharray', '6,4');
        } else {
          path.setAttribute('stroke', edgeColor);
          path.setAttribute('stroke-width', '1');
          path.setAttribute('stroke-opacity', '0.25');
          path.setAttribute('stroke-dasharray', '4,5');
        }

        edgesSvg.appendChild(path);
      }
    }

    // ============================================================
    // UPDATE NODE STATES
    // ============================================================
    function updateNodeStates(animate = false) {
      const cur = nodeMap[currentId];
      if (!cur) return;

      const childIds = new Set(cur.children);

      for (const node of nodes) {
        const el = node.el;
        if (!el) continue;
        el.classList.remove('state-current', 'state-visited', 'state-child', 'state-child-selected', 'state-hidden', 'revealing', 'popping');

        if (node.id === currentId) {
          el.classList.add('state-current');
          if (animate) el.classList.add('popping');
          el.style.borderColor = node.cssColor + '80';
          el.style.boxShadow = `0 0 24px ${node.cssColor}22, 0 0 6px ${node.cssColor}11`;
        } else if (visited.has(node.id) && !childIds.has(node.id)) {
          el.classList.add('state-visited');
          el.style.borderColor = node.cssColor + '30';
          el.style.boxShadow = '';
        } else if (childIds.has(node.id)) {
          const idx = cur.children.indexOf(node.id);
          if (idx === selectedChildIdx) {
            el.classList.add('state-child-selected');
            el.style.borderColor = node.cssColor + '80';
            el.style.boxShadow = `0 0 16px ${node.cssColor}44`;
          } else {
            el.classList.add('state-child');
            el.style.borderColor = node.cssColor + '30';
            el.style.boxShadow = '';
          }
        } else if (visited.has(node.id)) {
          el.classList.add('state-visited');
          el.style.borderColor = node.cssColor + '30';
          el.style.boxShadow = '';
        } else {
          el.classList.add('state-hidden');
        }
      }
    }

    // ============================================================
    // CAMERA
    // ============================================================
    function getViewportSize() {
      return { w: window.innerWidth, h: window.innerHeight - 40 };
    }

    function panTo(node, scale) {
      const { w, h } = getViewportSize();
      camScale = scale;
      camX = w / 2 - (node.x + node.width / 2) * scale;
      camY = h / 2 - (node.y + node.height / 2) * scale;
      applyCamera();
    }

    function applyCamera() {
      world.style.transform = `translate(${camX}px, ${camY}px) scale(${camScale})`;
    }

    function computeOverviewBounds() {
      const revealedNodes = nodes.filter(n => visited.has(n.id) || nodeMap[currentId].children.includes(n.id));
      if (!revealedNodes.length) return null;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const n of revealedNodes) {
        minX = Math.min(minX, n.x);
        minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x + n.width);
        maxY = Math.max(maxY, n.y + n.height);
      }
      const pad = 80;
      return { minX: minX - pad, minY: minY - pad, maxX: maxX + pad, maxY: maxY + pad };
    }

    function panToOverview() {
      const bounds = computeOverviewBounds();
      if (!bounds) return;
      const { w, h } = getViewportSize();
      const bw = bounds.maxX - bounds.minX;
      const bh = bounds.maxY - bounds.minY;
      const scale = Math.min(w / bw, h / bh, 0.8);
      camScale = scale;
      camX = w / 2 - (bounds.minX + bw / 2) * scale;
      camY = h / 2 - (bounds.minY + bh / 2) * scale;
      applyCamera();
    }

    // ============================================================
    // STAGGER REVEAL CHILDREN
    // ============================================================
    function revealChildren(childIds) {
      childIds.forEach((id, i) => {
        const node = nodeMap[id];
        if (!node || !node.el) return;
        setTimeout(() => {
          node.el.classList.add('revealing');
          setTimeout(() => node.el.classList.remove('revealing'), 600);
        }, i * 120);
      });
    }

    // ============================================================
    // TRAVEL TO NODE
    // ============================================================
    function travelTo(id, addToHistory = true) {
      const node = nodeMap[id];
      if (!node) return;

      const isNew = !visited.has(id);
      visited.add(id);
      currentId = id;

      if (addToHistory) {
        history.push(id);
      }

      selectedChildIdx = 0;
      updateNodeStates(true);

      if (!overviewMode) {
        panTo(node, 1);
      } else {
        panToOverview();
      }

      if (isNew) {
        setTimeout(() => revealChildren(node.children), 300);
      }

      drawEdges();
      updateHUD();
    }

    // ============================================================
    // HUD
    // ============================================================
    function updateHUD() {
      const node = nodeMap[currentId];
      document.getElementById('hud-node').textContent = node ? (node.emoji ? node.emoji + ' ' : '') + node.title : '—';
      document.getElementById('hud-depth').textContent = 'DEPTH: ' + (history.length - 1);
      const overviewEl = document.getElementById('hud-overview');
      if (overviewMode) overviewEl.classList.add('active');
      else overviewEl.classList.remove('active');
    }

    // ============================================================
    // KEYBOARD
    // ============================================================
    document.addEventListener('keydown', e => {
      const cur = nodeMap[currentId];
      if (!cur) return;

      switch (e.key) {
        case 'w': case 'W': case 'ArrowUp':
          e.preventDefault();
          goBack(); break;
        case 's': case 'S': case 'Enter': case ' ':
          e.preventDefault();
          goForward(); break;
        case 'a': case 'A': case 'ArrowLeft':
          e.preventDefault();
          selectChild(-1); break;
        case 'd': case 'D': case 'ArrowRight':
          e.preventDefault();
          selectChild(1); break;
        case 'Tab': case 'z': case 'Z':
          e.preventDefault();
          toggleOverview(); break;
      }
    });

    function goBack() {
      if (history.length <= 1) return;
      history.pop();
      const prevId = history[history.length - 1];
      currentId = prevId;
      selectedChildIdx = 0;
      updateNodeStates();
      if (!overviewMode) {
        panTo(nodeMap[prevId], 1);
      } else {
        panToOverview();
      }
      drawEdges();
      updateHUD();
    }

    function goForward() {
      const cur = nodeMap[currentId];
      if (!cur || !cur.children.length) return;
      const childId = cur.children[selectedChildIdx] || cur.children[0];
      if (childId) {
        if (overviewMode) { overviewMode = false; document.body.classList.remove('overview-mode'); }
        travelTo(childId);
      }
    }

    function selectChild(dir) {
      const cur = nodeMap[currentId];
      if (!cur || !cur.children.length) return;
      selectedChildIdx = (selectedChildIdx + dir + cur.children.length) % cur.children.length;
      updateNodeStates();
      drawEdges();
    }

    function toggleOverview() {
      overviewMode = !overviewMode;
      document.body.classList.toggle('overview-mode', overviewMode);
      if (overviewMode) panToOverview();
      else panTo(nodeMap[currentId], 1);
      updateHUD();
    }

    // ============================================================
    // INIT
    // ============================================================
    function init() {
      // Find start
      const startNode = nodeMap['start'] || nodes[0];
      if (!startNode) return;

      // Initial render
      visited.add(startNode.id);
      currentId = startNode.id;
      history = [startNode.id];
      selectedChildIdx = 0;

      updateNodeStates(false);
      drawEdges();
      updateHUD();

      // Set initial camera (no transition yet)
      world.style.transition = 'none';
      panTo(startNode, 1);

      // Re-enable transitions
      setTimeout(() => {
        world.style.transition = 'transform 0.55s cubic-bezier(0.4, 0, 0.2, 1)';
      }, 50);

      // Reveal children with stagger
      setTimeout(() => revealChildren(startNode.children), 200);

      // Hide loading
      const loading = document.getElementById('loading');
      loading.classList.add('hidden');
      setTimeout(() => loading.remove(), 600);
    }

    // Wait for fonts then init
    document.fonts.ready.then(init);
  </script>
</body>

</html>
