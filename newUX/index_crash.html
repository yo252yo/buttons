<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/colors.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Nunito', sans-serif;
    color: #fff;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
    color: #00BFFF;
    font-size: 14px;
    letter-spacing: 0.15em;
    z-index: 10;
    transition: opacity 0.4s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }

  #hint {
    position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.1); backdrop-filter: blur(8px);
    padding: 12px 28px; border-radius: 30px;
    font: 500 15px Nunito, sans-serif; color: #fff;
    transition: opacity 0.3s; pointer-events: none;
  }
  #hint.hidden { opacity: 0; }

</style>
</head>
<body>
<div id="loading">◈ LOADING CANVAS</div>
<div id="hint" class="hidden">A/D to chose your path, ENTER to go</div>
<canvas id="c"></canvas>

<script>
const COLOR_MAP = {
  '0': '#c8c4bf', '1': '#ffffff', '2': '#FF9966',
  '3': '#ffffff', '4': '#00FF40', '5': '#00BFFF',
  '6': '#DF73FF'
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  draw();
}
window.addEventListener('resize', resize);

let camX = 0, camY = 0, camScale = 2.5;
let focusX = 0, focusY = 0, focusTargetX = 0, focusTargetY = 0, targetCamScale = 2.5;
let dragStart = null, dragCam = null;

let nodes = [], groups = [], edges = [];
let visited = new Set();
let revealed = new Set();
let animFrame = null;

function startAnim() {
  if (animFrame) cancelAnimationFrame(animFrame);
  function tick() {
    let moving = false;
    for (const n of nodes) {
      const dx = n.tx - n.x, dy = n.ty - n.y;
      if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
        n.x += dx * 0.08; n.y += dy * 0.08;
        moving = true;
      } else { n.x = n.tx; n.y = n.ty; }
    }
    const cdx = focusTargetX - focusX, cdy = focusTargetY - focusY;
    if (Math.abs(cdx) > 0.5 || Math.abs(cdy) > 0.5) {
      focusX += cdx * 0.05; focusY += cdy * 0.05;
      moving = true;
    } else { focusX = focusTargetX; focusY = focusTargetY; }
    if (Math.abs(targetCamScale - camScale) > 0.001) {
      camScale += (targetCamScale - camScale) * 0.08;
      moving = true;
    } else { camScale = targetCamScale; }
    camX = W / 2 - focusX * camScale;
    camY = H / 2 - focusY * camScale;
    draw();
    if (moving) animFrame = requestAnimationFrame(tick);
    else animFrame = null;
  }
  tick();
}

let currentId = 'title_button';
let selectedIdx = 0;

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function getColor(k) { return COLOR_MAP[k] || '#c8c4bf'; }
function stripHtml(s) { return s.replace(/<[^>]*>/g, ''); }
function wordWrap(ctx, text, maxWidth) {
  const words = text.split(' '); const lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxWidth && line) { lines.push(line); line = w; }
    else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r);
    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r);
    this.quadraticCurveTo(x, y, x + r, y);
    return this;
  };
}

function computeNodeSize(n, maxW) {
  const parts = n.text.split(/\n---\n/);
  const titleRaw = parts[0].trim();
  const bodyRaw = parts.length > 1 ? parts.slice(1).join('---').trim() : '';
  const h1Match = titleRaw.match(/<h1>(.*?)<\/h1>/);
  const isHeading = !!h1Match;
  const titleText = isHeading ? stripHtml(h1Match[1].trim()) : stripHtml(titleRaw);
  let displayTitle = titleText, titleStart = 0;
  const fc = titleRaw.codePointAt(0);
  if (fc && /\p{Emoji}/u.test(String.fromCodePoint(fc))) {
    titleStart = 24;
    displayTitle = [...titleText].filter(ch => !/\p{Emoji}/u.test(ch)).join('').trim();
  }
  const padX = 10, lineH = isHeading ? 20 : 15, bodyLineH = 14;
  const titleFont = isHeading ? '700 18px Nunito, sans-serif' : '700 13px Nunito, sans-serif';
  const bodyFont = '400 11px Nunito, sans-serif';
  ctx.save();
  ctx.font = titleFont;
  const titleLines = wordWrap(ctx, displayTitle, maxW - padX * 2 - titleStart);
  const titleH = titleLines.length * lineH;
  ctx.font = bodyFont;
  const bodyLines = bodyRaw.length ? wordWrap(ctx, stripHtml(bodyRaw), maxW - padX * 2) : [];
  ctx.restore();
  const bodyH = bodyLines.length * bodyLineH;
  const gap = (titleLines.length && bodyH) ? 4 : 0;
  const boxH = Math.max((isHeading ? 50 : 34), padX + 2 + titleH + gap + bodyH + 8);
  return { w: maxW, h: boxH, isHeading, titleLines, bodyLines };
}

function layoutGrid(nodes, left, top, right, bottom) {
  const aw = right - left, ah = bottom - top;
  const k = nodes.length;
  if (!k || aw <= 4 || ah <= 4) return;
  let cols, rows;
  if (k <= 3) { cols = k; rows = 1; }
  else if (k === 4) { cols = 2; rows = 2; }
  else { cols = Math.ceil(Math.sqrt(k)); rows = Math.ceil(k / cols); }
  const cellW = aw / cols, cellH = ah / rows;
  for (let i = 0; i < k; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const n = nodes[i];
    const nw = Math.min(600, Math.max(200, cellW - 4));
    const sz = computeNodeSize(n, nw);
    n.tx = left + col * cellW + (cellW - sz.w) / 2;
    n.ty = top + row * cellH + (cellH - sz.h) / 2;
    n.clusterW = nw;
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  const gs = 40 * camScale;
  const ox = camX % gs, oy = camY % gs;
  for (let x = ox - gs; x < W + gs; x += gs)
    for (let y = oy - gs; y < H + gs; y += gs) {
      ctx.beginPath(); ctx.arc(x, y, 1, 0, Math.PI * 2); ctx.fill();
    }

  ctx.save();
  ctx.translate(camX, camY);
  ctx.scale(camScale, camScale);

  // Fog of war
  const childrenOf = id => edges.filter(e => e.fromNode === id).map(e => e.toNode);
  const visible = new Set(visited);
  visible.add(currentId);
  for (const c of childrenOf(currentId)) visible.add(c);
  for (const id of visible) revealed.add(id);

  const visibleEdge = e => revealed.has(e.fromNode) && revealed.has(e.toNode);

  const neigh = visibleNeighbors(currentId);
  if (selectedIdx >= neigh.length) selectedIdx = 0;
  const selId = neigh.length ? neigh[selectedIdx] : null;

  // Edges
  for (const e of edges) {
    if (!visibleEdge(e)) continue;
    const fn = nodes.find(n => n.id === e.fromNode);
    const tn = nodes.find(n => n.id === e.toNode);
    if (!fn || !tn) continue;
    const isSel = (e.fromNode === currentId && e.toNode === selId) ||
                  (e.toNode === currentId && e.fromNode === selId);
    const isConn = (e.fromNode === currentId) || (e.toNode === currentId);
    const isExplored = visited.has(e.fromNode) && visited.has(e.toNode);
    ctx.lineWidth = isSel ? 6 : isConn ? 5 : isExplored ? 4 : 4;
    ctx.strokeStyle = isSel ? 'rgba(255,255,255,0.5)' :
                      isConn ? 'rgba(255,255,255,0.25)' :
                      isExplored ? 'rgba(255,255,255,0.4)' :
                      'rgba(255,255,255,0.06)';
    ctx.beginPath();
    ctx.moveTo(fn.x + (fn.width || 300) / 2, fn.y + 10);
    ctx.lineTo(tn.x + (tn.width || 300) / 2, tn.y + 10);
    ctx.stroke();
  }

  // Nodes
  for (const n of nodes) {
    if (!revealed.has(n.id)) continue;
    const c = getColor(n.color);
    const parts = n.text.split(/\n---\n/);
    const titleRaw = parts[0].trim();
    const bodyRaw = parts.length > 1 ? parts.slice(1).join('---').trim() : '';

    const h1Match = titleRaw.match(/<h1>(.*?)<\/h1>/);
    const isHeading = !!h1Match;
    const titleText = isHeading ? stripHtml(h1Match[1].trim()) : stripHtml(titleRaw);
    const bodyText = stripHtml(bodyRaw);

    let displayTitle = titleText;
    let titleStart = 0;
    {
      const fc = titleRaw.codePointAt(0);
      if (fc && /\p{Emoji}/u.test(String.fromCodePoint(fc))) {
        titleStart = 24;
        displayTitle = [...titleText].filter(ch => !/\p{Emoji}/u.test(ch)).join('').trim();
      }
    }

    const padX = 10;
    const lineH = isHeading ? 20 : 15;
    const bodyLineH = 14;
    const titleFont = isHeading ? '700 18px Nunito, sans-serif' : '700 13px Nunito, sans-serif';
    const bodyFont = '400 11px Nunito, sans-serif';
    const maxBoxW = Math.min(600, Math.max(200, n.clusterW || n.width || 300));
    const innerW = maxBoxW - padX * 2 - titleStart;

    ctx.font = titleFont;
    const titleLines = wordWrap(ctx, displayTitle, innerW);
    const titleH = titleLines.length * lineH;

    ctx.font = bodyFont;
    const bodyLines = bodyRaw ? wordWrap(ctx, bodyText, maxBoxW - padX * 2) : [];
    const showBody = bodyLines.length && visited.has(n.id);
    const bodyH = showBody ? bodyLines.length * bodyLineH : 0;

    const gap = (titleLines.length && bodyH) ? 4 : 0;
    const boxH = Math.max((isHeading ? 50 : 34), padX + 2 + titleH + gap + bodyH + 8);

    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.roundRect(n.x, n.y, maxBoxW, boxH, 12);
    ctx.fill();

    if (n.id === currentId) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4 / camScale;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.roundRect(n.x - 2, n.y - 2, maxBoxW + 4, boxH + 4, 14);
      ctx.stroke();
    } else if (selId === n.id) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3 / camScale;
      ctx.setLineDash([6 / camScale, 4 / camScale]);
      ctx.beginPath();
      ctx.roundRect(n.x - 2, n.y - 2, maxBoxW + 4, boxH + 4, 14);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    if (titleStart) {
      ctx.font = '16px Nunito, sans-serif';
      ctx.fillStyle = '#000';
      ctx.textBaseline = 'top';
      const emoji = [...titleRaw].find(ch => /\p{Emoji}/u.test(ch)) || '';
      ctx.fillText(emoji, n.x + padX + 4, n.y + 6);
    }

    ctx.font = titleFont;
    ctx.fillStyle = '#000';
    ctx.textBaseline = 'top';
    let ly = n.y + padX + 2;
    for (const line of titleLines) {
      ctx.fillText(line, n.x + padX + 4 + titleStart, ly, innerW);
      ly += lineH;
    }

    if (showBody) {
      ly += gap;
      ctx.font = bodyFont;
      ctx.fillStyle = '#000';
      for (const line of bodyLines)
        ctx.fillText(line, n.x + padX + 4, ly, maxBoxW - padX * 2), ly += bodyLineH;
    }
  }

  ctx.restore();
}

// Pan & Zoom
canvas.addEventListener('mousedown', e => {
  dragStart = { x: e.clientX, y: e.clientY };
  dragCam = { x: camX, y: camY };
});
canvas.addEventListener('mousemove', e => {
  if (!dragStart) return;
  camX = dragCam.x + (e.clientX - dragStart.x);
  camY = dragCam.y + (e.clientY - dragStart.y);
  draw();
});
canvas.addEventListener('mouseup', () => { dragStart = null; });
canvas.addEventListener('mouseleave', () => { dragStart = null; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const dz = -e.deltaY * 0.001;
  const ns = Math.max(0.1, Math.min(2.5, camScale * (1 + dz)));
  if (ns === camScale) return;
  const mx = e.clientX, my = e.clientY;
  const wx = (mx - camX) / camScale;
  const wy = (my - camY) / camScale;
  camX = mx - wx * ns;
  camY = my - wy * ns;
  camScale = ns;
  draw();
}, { passive: false });
let touchStart = null, touchDist = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1)
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, cx: camX, cy: camY };
  else if (e.touches.length === 2) {
    const t = e.touches;
    touchDist = { d: Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY), s: camScale,
      mx: (t[0].clientX + t[1].clientX) / 2, my: (t[0].clientY + t[1].clientY) / 2, cx: camX, cy: camY };
    touchStart = null;
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && touchStart) {
    camX = touchStart.cx + (e.touches[0].clientX - touchStart.x);
    camY = touchStart.cy + (e.touches[0].clientY - touchStart.y);
    draw();
  } else if (e.touches.length === 2 && touchDist) {
    const t = e.touches;
    const nd = Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    const ns = Math.max(0.1, Math.min(2.5, touchDist.s * (nd / touchDist.d)));
    const wx = (touchDist.mx - touchDist.cx) / touchDist.s;
    const wy = (touchDist.my - touchDist.cy) / touchDist.s;
    camX = touchDist.mx - wx * ns;
    camY = touchDist.my - wy * ns;
    camScale = ns;
    draw();
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { touchStart = null; touchDist = null; });

function angleFrom(aId, bId) {
  const a = nodes.find(n => n.id === aId);
  const b = nodes.find(n => n.id === bId);
  if (!a || !b) return 0;
  return Math.atan2(b.y - a.y, b.x - a.x);
}

function buildAdj() {
  adj = {};
  for (const n of nodes) adj[n.id] = [];
  for (const e of edges)
    if (adj[e.fromNode] && adj[e.toNode]) {
      adj[e.fromNode].push(e.toNode);
      adj[e.toNode].push(e.fromNode);
    }
  const targetAngle = Math.PI; // 9 o'clock
  for (const id of Object.keys(adj)) {
    adj[id].sort((a, b) => angleFrom(id, a) - angleFrom(id, b));
    // Rotate so closest to targetAngle is first
    let best = 0, bestDiff = Infinity;
    for (let i = 0; i < adj[id].length; i++) {
      const diff = Math.abs(angleFrom(id, adj[id][i]) - targetAngle);
      if (diff < bestDiff) { bestDiff = diff; best = i; }
    }
    if (best) adj[id] = [...adj[id].slice(best), ...adj[id].slice(0, best)];
  }
}

function visibleNeighbors(id) {
  for (const c of edges.filter(e => e.fromNode === id).map(e => e.toNode))
    revealed.add(c);
  return (adj[id] || []).filter(nid => revealed.has(nid));
}

document.addEventListener('keydown', e => {
  const neighbors = visibleNeighbors(currentId);
  if (!neighbors.length) return;
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') {
    selectedIdx = (selectedIdx + 1) % neighbors.length;
    draw();
    e.preventDefault();
  } else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') {
    selectedIdx = (selectedIdx - 1 + neighbors.length) % neighbors.length;
    draw();
    e.preventDefault();
  } else if (e.key === 'Enter') {
    const targetId = neighbors[selectedIdx];
    if (targetId) travelTo(targetId);
    e.preventDefault();
  }
});

function updateHint() {
  const el = document.getElementById('hint');
  el.classList.toggle('hidden', currentId !== 'title_button');
}

function travelTo(id, snap) {
  if (!id) return;
  const dest = nodes.find(n => n.id === id);
  if (!dest) return;
  const prevId = currentId;
  const isTransition = prevId && prevId !== id;

  visited.add(id);
  for (const n of nodes) delete n.clusterW;

  // Canvas shift: all nodes shift by offset, so B appears to stay in place
  if (isTransition) {
    const offX = dest.ox - dest.x;
    const offY = dest.oy - dest.y;
    for (const n of nodes) {
      if (n.id === id || n.id === prevId) {
        n.tx = n.x + offX; n.ty = n.y + offY;
      } else {
        n.tx = n.ox + offX; n.ty = n.oy + offY;
      }
    }
    focusTargetX += offX; focusTargetY += offY;
  } else {
    for (const n of nodes) { n.tx = n.ox; n.ty = n.oy; }
  }

  // ---- Compute dest node size (for grid centering) ----
  const curSize = computeNodeSize(dest, Math.min(600, Math.max(200, dest.clusterW || dest.width || 300)));
  const nw = curSize.w, nh = curSize.h;
  const ccx = dest.tx + nw / 2, ccy = dest.ty + nh / 2;

  // ---- Gather neighbors for grid ----
  const childIds = new Set();
  const aboveIds = new Set(), belowIds = new Set();
  for (const e of edges) {
    if (e.fromNode === id) {
      childIds.add(e.toNode);
      const nb = nodes.find(n => n.id === e.toNode);
      if (!nb) continue;
      revealed.add(e.toNode);
      if (nb.oy < dest.oy) aboveIds.add(e.toNode);
      else belowIds.add(e.toNode);
    }
    if (e.toNode === id) {
      const nb = nodes.find(n => n.id === e.fromNode);
      if (!nb || !revealed.has(nb.id)) continue;
      if (nb.oy < dest.oy) aboveIds.add(e.fromNode);
      else belowIds.add(e.fromNode);
    }
  }
  if (prevId && aboveIds.has(prevId) && aboveIds.size === 1) {
    aboveIds.delete(prevId);
  }
  const above = [...aboveIds].map(nid => nodes.find(n => n.id === nid)).filter(Boolean);
  const below = [...belowIds].map(nid => nodes.find(n => n.id === nid)).filter(Boolean);

  // ---- Phase 3a: Scroll camera to B's current position ----
  focusTargetX = ccx; focusTargetY = ccy;
  camX = W / 2 - ccx * camScale;
  camY = H / 2 - ccy * camScale;

  // ---- Phase 3c: Grid layout for B's neighbors (centered on B's current pos) ----
  const viewW = W / targetCamScale, viewH = H / targetCamScale;
  const margin = 20;
  const vL = ccx - viewW / 2 + margin;
  const vR = ccx + viewW / 2 - margin;
  const vT = ccy - viewH / 2 + margin;
  if (above.length) layoutGrid(above, vL, vT, vR, dest.ty);
  if (below.length) layoutGrid(below, vL, dest.ty + nh, vR, vT + viewH - 2 * margin);

  // ---- Zoom refinement (post-grid, from actual span) ----
  if (Math.abs(camScale - 2.5) < 0.01) {
    let yMin = dest.ty, yMax = dest.ty + nh;
    if (prevId && !aboveIds.has(prevId) && !belowIds.has(prevId)) {
      const aNode = nodes.find(n => n.id === prevId);
      if (aNode) { yMin = Math.min(yMin, aNode.ty); yMax = Math.max(yMax, aNode.ty + 60); }
    }
    for (const n of above) { yMin = Math.min(yMin, n.ty); yMax = Math.max(yMax, n.ty + 60); }
    for (const n of below) { yMin = Math.min(yMin, n.ty); yMax = Math.max(yMax, n.ty + 60); }
    const span = yMax - yMin;
    const defH = H / 2.5;
    if (span > defH * 0.85) {
      targetCamScale = Math.max(0.1, Math.min(2.5, 2.5 / (span / (defH * 0.85))));
    }
  }

  currentId = id;
  selectedIdx = 0;
  updateHint();
  if (snap) {
    for (const n of nodes) { n.x = n.tx; n.y = n.ty; }
    camScale = targetCamScale;
    draw();
  } else {
    startAnim();
  }
}

async function load() {
  try {
    const res = await fetch('assets/story.canvas');
    const data = await res.json();
    for (const n of data.nodes) {
      if (n.type === 'group') {
        groups.push(n);
      } else if (n.type === 'text') {
        const m = Object.assign({}, n);
        m.ox = m.x; m.oy = m.y;
        nodes.push(m);
      }
    }
    if (data.edges) {
      edges.push(...data.edges);
      edges.push({ fromNode: 'title_button', toNode: 'start', color: '2' });
    }
    buildAdj();
    visited.add('title_button');
    revealed.add('title_button');
    currentId = 'title_button';
    selectedIdx = 0;
    resize();
    travelTo('title_button', true);
    document.getElementById('loading').classList.add('hidden');
  } catch (e) {
    document.getElementById('loading').textContent = '◈ ERROR LOADING CANVAS';
    console.error(e);
  }

}

load();
</script>
</body>
</html>
