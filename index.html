<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/interface.css">
  <link rel="stylesheet" href="css/buttons.css">
  <script src="js/story.js"></script>
  <script src="js/buttons.js"></script>
</head>

<body>
  <div id="interface" class="interface">
    <div id="margin_interface" class="margin_interface"></div>
    <div class="interface_button" title="Threads">🧵</div>
    <div class="interface_button" title="Settings">⚙️</div>
    <div class="interface_button" title="Collections">☺️</div>
    <div class="interface_button" title="Progress">🎨</div>
    <div class="interface_button" title="Archive">🗑️</div>
    <div class="interface_button" title="Characters">👥</div>
    <div class="interface_button" title="Locations">📍</div>
    <div class="interface_button" title="Times">⏰</div>
    <div class="interface_button" title="Quests">🏆</div>
    <div class="interface_button" title="Disk">💾</div>
    <div class="interface_button" title="Audio">🎵</div>
    <div class="interface_button" title="Catches">🐟</div>
    <div class="interface_button" title="Help">❔</div>
  </div>

  <div class="buttons_zone">
    <div id="title" class="button button-orange">
      <h1>Push Your Buttons!</h1>
    </div>
  </div>

  <div class="background_stripes">
    <div class="background_stripe"></div>
    <div class="background_stripe"></div>
    <div class="background_stripe"></div>
    <div class="background_stripe"></div>
    <div class="background_stripe"></div>
  </div>
</body>

</html>
