<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/background.css">
  <link rel="stylesheet" href="css/interface_bar.css">
  <link rel="stylesheet" href="css/meta_buttons.css">
  <link rel="stylesheet" href="css/buttons.css">
  <script type="module" src="js/engine.js"></script>
</head>

<body>
  <div id="interface" class="interface">
    <div id="margin_interface" class="margin_interface"></div>
    <div class="interface_button button-grey" title="Threads">🧵</div>
    <div class="interface_button button-green" title="Settings">⚙️</div>
    <div class="interface_button button-blue" title="Collections">☺️</div>
    <div class="interface_button button-blue" title="Progress">🎨</div>
    <div class="interface_button button-orange" title="Archive">🗑️</div>
    <div class="interface_button button-purple" title="Characters">👥</div>
    <div class="interface_button button-purple" title="Locations">📍</div>
    <div class="interface_button button-grey" title="Times">⏰</div>
    <div class="interface_button button-grey" title="Quests">🏆</div>
    <div class="interface_button button-grey" title="Disk">💾</div>
    <div class="interface_button button-green" title="Audio">🎵</div>
    <div class="interface_button button-grey" title="Catches">🐟</div>
    <div class="interface_button button-grey" title="Help">❓</div>
    <div class="interface_button button-grey" title="STARters">⭐</div>
  </div>

  <div id="meta_button" class="meta_button meta_button-grey" style="display: none;"></div>

  <div id="buttons_zone" class="buttons_zone">
    <div id="title" class="button button-orange">
      <h1>Push YOUR Buttons!</h1>
    </div>
  </div>

  <div class="background_stripes">
    <div class="background_stripe"></div>
    <div class="background_stripe"></div>
    <div class="background_stripe"></div>
    <div class="background_stripe"></div>
    <div class="background_stripe"></div>
  </div>

  <div class="black_stripe"></div>
</body>

</html>
